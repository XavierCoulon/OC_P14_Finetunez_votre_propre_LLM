sources:
  mediqa:
    hf_dataset: "lavita/medical-qa-datasets"
    hf_config: "medical_meadow_mediqa"
    language: en
    target_pairs: 1000
    split: train
    enabled: false  # Désactivé : remplacé par chatdoctor_healthcaremagic (vraies consultations patient-médecin).
                    # Note : bug collecteur corrigé (instruction→question, pas input), mais qualité inférieure à ChatDoctor.

  chatdoctor:
    hf_dataset: "lavita/medical-qa-datasets"
    hf_config: "chatdoctor_healthcaremagic"
    language: en
    target_pairs: 1000
    split: train
    # skip_anonymization non posé → Presidio actif : source contient vraies questions patients (prénoms, symptômes personnels)

  frenchmedmcqa:
    hf_dataset: "frenchmedmcqa/frenchmedmcqa"
    language: fr
    target_pairs: 1500
    split: train
    skip_anonymization: true  # QCM d'examen — aucun PII patient. Le modèle FR taggue à tort les termes médicaux capitalisés (Élévation, Leucémie, Pseudomonas...) comme PERSON.

  medquad:
    hf_dataset: "lavita/MedQuAD"
    language: en
    target_pairs: 3500
    split: train
    skip_anonymization: true  # Q&A éducatif NIH/GARD — aucun PII patient. Presidio taggait à tort : gènes (KANK2→LOCATION), éponyms médicaux (Knobloch→PERSON), géographie de maladies (Naxos→NRP). 46% des records affectés.

  ultramedical:
    hf_dataset: "TsinghuaC3I/UltraMedical"
    language: en
    target_pairs_sft: 500
    target_pairs_dpo: 2000
    dpo_score_gap_min: 0.3
    split: train
    skip_anonymization: true  # Vignettes cliniques synthétiques (MedQA/USMLE) — patients fictifs. Presidio détruisait l'information clinique : "23-year-old" → <DATE_TIME>, "22 weeks gestation" → <DATE_TIME>. 98% des records SFT et 84% DPO affectés.
